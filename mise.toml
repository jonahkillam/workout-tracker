[tools]
node = "24"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Start the dev server"
depends = ["install"]
run = "npx vite"

[tasks."dev:local"]
description = "Start the dev server against the local Supabase stack"
depends = ["install"]
run = """
eval "$(supabase status -o env | sed -nE 's/^API_URL=/export SUPABASE_URL=/p; s/^PUBLISHABLE_KEY=/export SUPABASE_PUBLISHABLE_KEY=/p; s/^SECRET_KEY=/export SUPABASE_SECRET_KEY=/p')"
npx vite
"""

[tasks."db:start"]
description = "Start the local Supabase stack (Docker); sign-in emails appear in Mailpit"
run = "supabase start"

[tasks."db:reset"]
description = "Recreate the local database from supabase/migrations"
run = "supabase db reset"

[tasks."db:test"]
description = "Run the database tests (pgTAP) against the local stack"
run = "supabase test db"

[tasks.test]
description = "Run parser and metrics tests"
depends = ["install"]
run = "npx vitest run"

[tasks."test:watch"]
description = "Run tests in watch mode"
depends = ["install"]
run = "npx vitest"

[tasks.typecheck]
description = "Type-check the project"
depends = ["install"]
run = "npx tsc -b"

[tasks.lint]
description = "Lint with oxlint"
depends = ["install"]
run = "npx oxlint"

[tasks.check]
description = "Typecheck, lint and test"
depends = ["typecheck", "lint", "test"]

[tasks.build]
description = "Production build into dist/"
depends = ["install"]
run = "npm run build"

[tasks.preview]
description = "Serve the production build"
depends = ["build"]
run = "npx vite preview"
